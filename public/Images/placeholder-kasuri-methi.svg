<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E9CF" />
      <stop offset="100%" stop-color="#E3C093" />
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#warmBg)" />
  <circle cx="500" cy="460" r="260" fill="#FFFFFF" fill-opacity="0.5" stroke="#4C5A44" stroke-width="3" />

  <!-- trifoliate dried fenugreek leaves -->
  <g>
    <g transform="translate(460 460) rotate(-10)">
      <ellipse cx="0" cy="-55" rx="26" ry="36" fill="#8C9A5E" stroke="#56654E" stroke-width="2" />
      <ellipse cx="-34" cy="10" rx="26" ry="36" fill="#9CA86E" stroke="#56654E" stroke-width="2" transform="rotate(-25 -34 10)" />
      <ellipse cx="34" cy="10" rx="26" ry="36" fill="#9CA86E" stroke="#56654E" stroke-width="2" transform="rotate(25 34 10)" />
      <line x1="0" y1="55" x2="0" y2="90" stroke="#56654E" stroke-width="4" />
    </g>
    <g transform="translate(575 500) rotate(15) scale(0.8)">
      <ellipse cx="0" cy="-55" rx="26" ry="36" fill="#B08D57" stroke="#8B5E34" stroke-width="2" />
      <ellipse cx="-34" cy="10" rx="26" ry="36" fill="#C0A06A" stroke="#8B5E34" stroke-width="2" transform="rotate(-25 -34 10)" />
      <ellipse cx="34" cy="10" rx="26" ry="36" fill="#C0A06A" stroke="#8B5E34" stroke-width="2" transform="rotate(25 34 10)" />
      <line x1="0" y1="55" x2="0" y2="90" stroke="#8B5E34" stroke-width="4" />
    </g>
  </g>

  <image href="/favicon.png" x="800" y="800" width="150" height="153" opacity="0.92" />
